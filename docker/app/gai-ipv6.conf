# Prefer reachable IPv6 on Docker Desktop hosts with broken IPv4 internet.
# Docker's IPv6 source is a ULA. Give it the same label as global IPv6
# destinations so RFC 6724 label matching does not favor broken IPv4 first.
# IPv4 remains available for PostgreSQL, Redis and IPv4-only destinations.
# This file is mounted only by the optional compose.smtp-ipv6.yml overlay.
label ::1/128 0
label ::/0 1
label ::ffff:0:0/96 4
precedence ::1/128 50
precedence ::/0 40
precedence ::ffff:0:0/96 10
